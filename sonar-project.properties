sonar.host.url=http://sonarqube:9000
    sonar.projectKey=DDSheetfinal
    # Token should be passed via command line: -Dsonar.token=YOUR_TOKEN
    # or via environment variable when running docker
    
    sonar.sources=.
        # Exclude test files and common editor/build/cache folders that are not part of
        # the project's source code. This prevents Sonar from flagging JSON-based
        # deep-clone patterns inside editor extensions, VS Code caches, or node_modules.
        sonar.exclusions=**/*_test.go,**/node_modules/**,**/.vscode/**,**/.vscode-server/**,**/.git/**,**/bin/**,**/out/**,**/.history/**,**/dist/**
    
    sonar.tests=.
    sonar.test.inclusions=**/*_test.go